- id: url:https://iris.uniroma1.it/handle/11573/1759472
  type: thesis
  hide_from_research: true
  title: "Quantity and Quality in AI Inferred Knowledge: Symbolic and Neurosymbolic Perspectives"
  authors:
  - Luca Andolfi
  publisher: "Sapienza University of Rome"
  date: '2026-01-28'
  description: "This Thesis argues that before AI can be safely employed in high-stakes domains, it is crucial to reconcile a hidden tension between two requirements: providing abundant, non-trivial information (quantity) while ensuring it is trustworthy (quality). It studies pure logic-based and neuro-symbolic AI across two representative applications — question answering over knowledge bases and computer vision — showing how to improve each with respect to this quantity/quality dichotomy."


- id: url:https://ceur-ws.org/Vol-3739/abstract-2.pdf
  type: paper
  hide_from_research: true
  title: "Informativeness of Query Answers for Knowledge Bases (Extended Abstract)"
  authors:
  - Luca Andolfi
  - Gianluca Cima
  - Marco Console
  - Maurizio Lenzerini
  publisher: "International Workshop on Description Logics (DL 2024)"
  date: '2024-06-18'
  description: "Extended abstract summarising a formal framework to characterize the information that query answers for knowledge bases are able to represent, studying the informativeness of existing approaches and introducing novel notions of certain and possible answers."


- id: doi:10.1609/aaai.v40i23.38963
  type: paper
  hide_from_research: true
  publisher: AAAI
  description: "We introduce Regularly Recurrent Answers (RRAs), a novel form of query answer for knowledge bases that represents infinite sets of tuples of constants via a simple generation mechanism. We show that RRAs can express a significant portion of the certain information derivable from unions of conjunctive queries over DL-Lite knowledge bases, and study the computational complexity of answering queries using this new language."


- id: doi:10.1609/aaai.v38i9.28912
  type: paper
  hide_from_research: true
  publisher: AAAI
  date: '2024-03-24'
  description: "Standard query answering for knowledge bases — returning certain answers (true in every model) or possible answers (true in some model) — is a lossy representation of the information that a knowledge base and query can provide. We introduce a formal framework to characterize the information that query answers are able to represent, use it to study the informativeness of existing approaches, and define a novel notion of answers allowing repetition of variables across tuples, showing they capture a meaningful form of information with favourable data complexity."


- id: doi:10.48550/arXiv.2602.12586
  type: paper
  image: /images/research/mcdiffuse.png
  publisher: ICML
  date: '2026-07-01'
  description: "We introduce McDiffuSE, a framework that formulates slot selection in Masked Diffusion Models as decision making and optimises infilling orders through Monte Carlo Tree Search. Look-ahead simulations evaluate partial completions before commitment, systematically exploring the combinatorial space of generation orders. McDiffuSE achieves average gains of 3.2% over autoregressive baselines and 8.0% over plan-and-infill baselines, with notable improvements of 19.5% on MBPP and 4.9% on MATH500."


- id: doi:10.48550/arXiv.2510.25497
  type: paper
  image: /images/research/r4rr.png
  publisher: NeurIPS
  date: '2025-09-01'
  link: https://proceedings.neurips.cc/paper_files/paper/2025/hash/e6bb63d00f597c380c012bd99c68b0c1-Abstract-Conference.html
  description: "Neurosymbolic AI models are prone to reasoning shortcuts — learning spurious correlations rather than the intended concepts. We introduce Prototypical Neurosymbolic architectures that avoid shortcuts at their root cause by training models to satisfy background knowledge while accounting for input similarity to a handful of labelled datapoints. We validate on the rsbench benchmark suite across synthetic (MNIST-EvenOdd, Kand-Logic) and real-world (BDD-OIA) tasks, showing significant improvements in learning the right concepts even in extremely low data regimes."
  buttons:
    - type: source
      text: Code
      link: https://github.com/Giotto-maker/r4rr


- id: doi:10.48550/arXiv.2502.18237
  type: paper
  image: /images/research/DRL.png
  description: We introduce the Disjunctive Refinement Layer (DRL), a novel layer designed to enforce the alignment of generated data with the background knowledge specified in user-defined constraints. DRL is the first method able to automatically make deep learning models inherently compliant with constraints as expressive as quantifier-free linear formulas, which can define non-convex and even disconnected spaces.
  publisher: ICLR
  buttons:
    - type: source
      text: Code
      link: https://github.com/mihaela-stoian/DRL_DGM


- id: doi:10.3233/FAIA250782
  type: paper
  image: /images/research/ECAI.png
  publisher: ECAI
  date: '2025-07-10'
  description: "We contrast two approaches to ensuring machine learning systems satisfy formal requirements in safety-critical settings: integrating requirements directly into model architecture and training (a priori design) versus analyzing trained models for desired properties (a posteriori verification)."


- id: doi:10.48550/arXiv.2508.21787
  type: paper
  image: /images/research/picsar.png
  description: "We propose PiCSAR (Probabilistic Confidence Selection And Ranking), a simple training-free method for best-of-n sampling that scores candidate reasoning chains using the joint log-likelihood of the reasoning and final answer. This naturally decomposes into reasoning confidence and answer confidence. PiCSAR achieves substantial gains across diverse benchmarks (+10.18 on MATH500, +9.81 on AIME2025), outperforming baselines with at least 2× fewer samples in 16 out of 20 comparisons."
  publisher: "ACL (Findings)"
  date: '2026-03-01'
  buttons:
    - type: source
      text: Code
      link: https://doi.org/10.48550/arXiv.2508.21787



- id: doi:10.48550/arXiv.2503.05954
  type: paper
  image: /images/research/survey_tab_synth.png
  description: "We review deep generative modelling approaches for tabular data from the perspective of four types of requirements: utility of the synthetic data, alignment of the synthetic data with domain-specific knowledge, statistical fidelity of the synthetic data distribution compared to the real data distribution, and privacy-preserving capabilities."
  publisher: TMLR
  date: '2026-01-01'



- id: doi:10.48550/arXiv.2402.04823
  type: paper
  image: /images/research/dgm+ll.png
  publisher: ICLR
  description: We show how deep generative models for tabular data can be constrained such that their generated samples are guaranteed to be compliant with given constraints. This is achieved by automatically parsing the constraints and transforming them into a Constraint Layer seamlessly integrated with the model.
  buttons:
    - type: source
      text: Code
      link: https://github.com/mihaela-stoian/ConstrainedDGM


- id: doi:10.48550/arXiv.2409.12642
  type: paper
  image: /images/research/adv_gan.png
  description: We adapt popular tabular deep generative models into adversarial models and evaluate their effectiveness in generating realistic adversarial examples that conform to domain constraints.
  publisher: ICMLC
  buttons:
    - type: source
      text: Code
      link: https://github.com/salijona/C-AdvDGM


- id: doi:10.1016/j.ijar.2024.109124
  type: paper
  image: /images/research/CCN+.png
  publisher: "International Journal of Approximate Reasoning"
  description: "We present CCN+, a neuro-symbolic framework that integrates logical requirements directly into neural network outputs using inference rules to ensure compliance, and adapts the standard binary cross-entropy loss for constraint satisfaction in deep learning."


- id: doi:10.1007/978-3-031-71167-1_12
  type: paper
  image: /images/research/ULLER.png
  publisher: "NeSy (Spotlight)"
  description: "We introduce ULLER, a unified language for learning and reasoning that standardises how background knowledge is expressed across neuro-symbolic AI frameworks. ULLER provides first-order logic syntax with multiple semantic interpretations."


- id: doi:10.48550/arXiv.2402.18285
  type: paper
  image: /images/research/pishield_demo.png
  description: We introduce PiShield, the first package ever allowing for the integration of (propositional or linear) requirements into the neural networks’ topology. PiShield guarantees compliance with these requirements, regardless of input.
  publisher: IJCAI
