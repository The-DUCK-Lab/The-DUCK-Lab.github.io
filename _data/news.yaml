- date: 09-2026
  title: Invited talk at NESYRE 2026 in Berlin
  members: [Eleonora]
  description: "Eleonora will give an invited talk at [NESYRE 2026](https://www.wias-berlin.de/workshops/NESYRE2026/) — Neuro-symbolic AI, Mathematical Reasoning and Agents — at the Weierstrass Institute in Berlin (14–17 September). The speaker line-up looks amazing! ✨"

- date: 08-2026
  title: Tutorial at UAI 2026 in Amsterdam
  members: [Mihaela, Eleonora]
  description: "Mihaela and Eleonora will give a [tutorial](https://www.auai.org/uai2026/tutorials) at UAI 2026 in Amsterdam (17–21 August): *Beyond Soft Penalties: Hard Constraints for Neural Networks with Continuous Outputs* — how to enforce hard constraints on neural networks with continuous outputs."

- date: 07-2026
  title: Joshua at ICML 2026 in Seoul!
  members: [Joshua]
  description: "☕ Joshua is at [ICML 2026](https://icml.cc/) in Seoul presenting [Can I Have Your Order? Monte-Carlo Tree Search for Slot Filling Ordering in Diffusion Language Models](https://doi.org/hbz7sm) — using MCTS to decide the order in which diffusion language models fill in slots. If you'd like to grab a coffee with him, let us know!"

