- date: 06-2026
  title: Pythagoras-Prover released!
  members: [Joshua, Mihaela, Eleonora]
  description: "🚀 We are thrilled to announce the release of [Pythagoras-Prover](https://pythagoras-lm.github.io) — a compute-efficient family of Lean theorem provers! Strong results at just 4B parameters, powered by Augmented Lean Formalisation. The models are now available on [Hugging Face](https://huggingface.co/Pythagoras-LM) 🤗"

