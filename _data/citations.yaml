- id: url:https://openreview.net/forum?id=Wz5gx3Y731
  title: Constraint-Satisfying Reinforcement Learning via a Neuro-Symbolic Projection
    Layer
  authors:
  - Jacob Brand
  - Francesco Belardinelli
  - Eleonora Giunchiglia
  publisher: NeSy
  date: '2026-09-01'
  link: ''
  type: paper
  image: /images/research/nesy2026_jack.png
  description: "We introduce CCN+RL, a neuro-symbolic framework that enforces propositional\
    \ constraints on a deep RL policy's action distribution by construction. Building\
    \ on Coherent-by-Construction Networks Plus (CCN+), it projects softmax action\
    \ probabilities onto the constraint-satisfying region of the action space at each\
    \ timestep through a fully differentiable symbolic projection layer, adding only\
    \ a single pass through a fixed dependency graph at inference. It supports both\
    \ hard enforcement (zero mass on invalid actions, per-step guarantees) and soft\
    \ enforcement (graded down-weighting of invalid actions). On CartPole, CliffWalking,\
    \ and Seaquest, CCN+RL attains hard runtime safety with competitive task reward,\
    \ while its soft mode reaches lower attempted-violation rates \u2014 evidence\
    \ that the policy internalises the constraints rather than relying on an external\
    \ shield."
  plugin: sources.py
  file: sources.yaml
