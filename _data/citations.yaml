  image: /images/research/r4rr.png
  description: "Neurosymbolic AI models are prone to reasoning shortcuts \u2014 learning\
    \ spurious correlations rather than the intended concepts. We introduce Prototypical\
    \ Neurosymbolic architectures that avoid shortcuts at their root cause by training\
    \ models to satisfy background knowledge while accounting for input similarity\
    \ to a handful of labelled datapoints. We validate on the rsbench benchmark suite\
