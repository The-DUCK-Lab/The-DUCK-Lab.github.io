  type: paper
  hide_from_research: true
  description: "Standard query answering for knowledge bases \u2014 returning certain\
    \ answers (true in every model) or possible answers (true in some model) \u2014\
    \ is a lossy representation of the information that a knowledge base and query\
    \ can provide. We introduce a formal framework to characterize the information\
    \ that query answers are able to represent, use it to study the informativeness\
    \ of existing approaches, and define a novel notion of answers allowing repetition\
    \ of variables across tuples, showing they capture a meaningful form of information\
    \ with favourable data complexity."
